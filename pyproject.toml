[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.flake8]
max-line-length = 150

[tool.pylint.messages_control]
# O projeto usa Pylance/Pyright + flake8 para erros acionaveis e formato.
# Estas regras do Pylint geram ruido recursivo em services legados grandes
# (principalmente OOXML), sem indicar erro funcional imediato.
disable = [
    "consider-using-from-import",
    "duplicate-code",
    "import-outside-toplevel",
    "invalid-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "broad-exception-caught",
    "no-member",
    "too-many-arguments",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-statements",
    "unused-argument",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sra-pli-5"
version = "1.0.0"
description = "Sistema de Relatório de Atividades - PLI-SP"
