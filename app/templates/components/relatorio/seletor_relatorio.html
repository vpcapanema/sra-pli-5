{% macro seletor_relatorio(relatorios, id_relatorio_selecionado) %}
<div class="sra-form-group">
    <label class="sra-form-label" for="seletor-relatorio">
        Selecionar Relatório
    </label>
    <select id="seletor-relatorio"
            name="id_relatorio"
            class="sra-form-select">
        <option value="">-- Selecione um relatório --</option>
        {% for relatorio in relatorios %}
        {% set tipo_label = 'Em Produção' if relatorio.tipo_relatorio == 'producao' else 'Base' %}
        <option value="{{ relatorio.id }}"
                {% if relatorio.id == id_relatorio_selecionado %}selected{% endif %}>
            {{ relatorio.codigo or relatorio.codigo_d20 }} — {{ tipo_label }}
        </option>
        {% endfor %}
    </select>
</div>
{% endmacro %}
