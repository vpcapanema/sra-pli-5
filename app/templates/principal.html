{% extends "layouts/base.html" %}

{% block conteudo %}
<div class="layout-principal" hx-boost="true" hx-target="#sra-main" hx-swap="innerHTML" hx-push-url="true">
    <aside class="sidebar" hx-preserve>
        {% include "components/compartilhados/sidebar.html" %}
    </aside>
    <main class="conteudo-principal" id="sra-main">
        {% for componente in componentes %}
            {% include componente %}
        {% endfor %}
    </main>
</div>
{% endblock %}
